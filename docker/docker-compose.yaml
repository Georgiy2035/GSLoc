services:
  multi-modal-place-recognition:
    image: mmpr/localization
    build:
      context: ../
      dockerfile: ./docker/Dockerfile.deploy
    restart: unless-stopped
    network_mode: host
    ipc: host
    pid: host
    tty: true
    privileged: true
    environment:
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR
      - DISPLAY=$DISPLAY
      - VGL_DISPLAY=${RENDER_DISPLAY:-":1"}
      # - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      # - CYCLONEDDS_URI=/cyclonedds.xml
      # - FASTRTPS_DEFAULT_PROFILES_FILE=/fastdds.xml
    volumes:
      - /tmp/.X11-unix/:/tmp/.X11-unix
      - ${DATA_DIR}/robots/${ROBOT_MODEL}:/opt/slam/params/
      - ${ROOT_DIR}:/home/${USER}/multimodal-place-recognition
      - ${DATA_DIR}:/home/${USER}/Datasets
      # - ${ROOT_DIR}/install/cyclonedds.xml:/cyclonedds.xml
    runtime: nvidia
    command: bash

  multi-modal-place-recognition-notebooks:
    image: mmpr/localization
    build:
      context: ../
      dockerfile: ./docker/Dockerfile.deploy
    restart: unless-stopped
    network_mode: host
    ipc: host
    pid: host
    tty: true
    privileged: true
    environment:
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR
      - DISPLAY=$DISPLAY
      - VGL_DISPLAY=${RENDER_DISPLAY:-":1"}
      # - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      # - CYCLONEDDS_URI=/cyclonedds.xml
      # - FASTRTPS_DEFAULT_PROFILES_FILE=/fastdds.xml
    volumes:
      - /tmp/.X11-unix/:/tmp/.X11-unix
      - ${DATA_DIR}/robots/${ROBOT_MODEL}:/opt/slam/params/
      - ${ROOT_DIR}:/home/${USER}/multimodal-place-recognition
      - ${DATA_DIR}:/home/${USER}/Datasets
      # - ${ROOT_DIR}/install/cyclonedds.xml:/cyclonedds.xml
    runtime: nvidia
    command: jupyter notebook --allow-root
